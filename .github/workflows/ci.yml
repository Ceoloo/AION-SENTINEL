name: Sentinel foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies from reviewed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate syntax and run contract tests
        run: npm run check
